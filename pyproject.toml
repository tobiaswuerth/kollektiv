[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "kollektiv"
version = "4.0.0"
description = "A local, resumable collective of LangGraph agents working toward a shared goal"
requires-python = ">=3.11"
dependencies = [
  "langchain>=1.4.4,<2",
  "langchain-ollama>=1.1.0,<2",
  "langgraph>=1.2.14,<2",
  "langgraph-checkpoint-sqlite>=3.0.1,<4",
  "pydantic>=2.12,<3",
  "httpx>=0.28,<1",
  "ddgs>=9,<10",
  "trafilatura>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.14,<1"]

[project.scripts]
kollektiv = "kollektiv.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kollektiv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["ollama: opt-in tests using a live Ollama model"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
